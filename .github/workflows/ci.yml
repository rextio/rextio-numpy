name: CI

on:
  push:
    branches: [main, "0.1.3"]
  pull_request:
    branches: [main, "0.1.3"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "rextio==0.1.6"
      - run: python -m pip install pytest ruff mypy numpy hypothesis build
      - run: python -m pip install --no-deps -e .
      - run: python -c "from rextio.plugins.api import PLUGIN_API_VERSION; major, minor = map(int, PLUGIN_API_VERSION.split('.', 1)); assert 1 <= major < 2 and minor >= 5, PLUGIN_API_VERSION"
      - run: python -c "from rextio_numpy import __version__; assert __version__ == '0.1.3', __version__"
      - run: >
          python -m pytest
          tests/test_claim_and_lower.py
          tests/test_claim_linear.py
          tests/test_claim_reductions.py
          tests/test_claim_methods.py
          tests/test_claim_unary.py
          tests/test_claim_fusion.py
          tests/test_compare_where.py
          tests/test_integration_compare_where.py
          tests/test_integration_fusion.py
          tests/test_lower_binops.py
          tests/test_lower_contract_hardening.py
          tests/test_lower_fusion.py
          tests/test_lower_linear.py
          tests/test_lower_reductions.py
          tests/test_lower_methods.py
          tests/test_lower_unary.py
          tests/test_plugin.py
          tests/test_plugin_types.py
          tests/test_types_vocabulary.py
          tests/test_rules_records.py
          tests/test_return_ownership.py
      - run: ruff check src tests
      - run: mypy src
      - run: python -m build

  native-certification:
    name: Required native certification (Core 0.1.6 / compatible API 1.x)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "rextio==0.1.6"
      - run: python -m pip install pytest numpy hypothesis
      - run: python -m pip install --no-deps -e .
      - run: python -c "from rextio.plugins.api import PLUGIN_API_VERSION; major, minor = map(int, PLUGIN_API_VERSION.split('.', 1)); assert 1 <= major < 2 and minor >= 5, PLUGIN_API_VERSION"
      - name: Run the complete required native certification suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -ra \
            tests/test_certification_real_cargo.py \
            tests/test_f64_1d_output_helper_real_cargo.py \
            | tee pytest-output.txt
          ! grep -Eq '[0-9]+ skipped' pytest-output.txt
