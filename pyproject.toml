[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rextio-numpy"
dynamic = ["version"]
description = "Rextio plugin that lowers eligible NumPy code to native Rust (plugin API 1.1: claim/lower, annotation vocabulary, pinned crate injection)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Steve Si-young Song", email = "rextio.co@gmail.com"}
]
keywords = ["rextio", "numpy", "rust", "compiler", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]
# The plugin implements protocol v2 from rextio.plugins.api, introduced in
# rextio 0.1.1. NumPy itself is deliberately NOT a dependency: the plugin
# describes and (later) lowers the USER project's numpy usage.
dependencies = [
  "rextio>=0.1.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/rextio/rextio-numpy"
Repository = "https://github.com/rextio/rextio-numpy"
Issues = "https://github.com/rextio/rextio-numpy/issues"

[project.entry-points."rextio.plugins"]
rextio-numpy = "rextio_numpy.plugin:plugin"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
  "mypy>=1.11",
]

[tool.setuptools.dynamic]
version = {attr = "rextio_numpy.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "D"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
